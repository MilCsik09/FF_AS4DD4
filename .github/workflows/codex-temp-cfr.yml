name: Temporary CFR transport

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify CFR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar \
            --output cfr-0.152.jar
          printf '%s  %s\n' \
            'f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2' \
            'cfr-0.152.jar' | sha256sum --check --strict
      - name: Upload verified CFR
        uses: actions/upload-artifact@v4
        with:
          name: codex-temp-cfr-0.152
          path: cfr-0.152.jar
          if-no-files-found: error
          retention-days: 1
