name: Temporary Gradle bootstrap

on:
  push:
    branches:
      - tmp/gradle-9.4.1-bootstrap
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify official Gradle 9.4.1 distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output gradle-9.4.1-bin.zip \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip
          curl --fail --location --retry 3 --output gradle-9.4.1-bin.zip.sha256 \
            https://services.gradle.org/distributions/gradle-9.4.1-bin.zip.sha256
          printf '%s  gradle-9.4.1-bin.zip\n' "$(tr -d '[:space:]' < gradle-9.4.1-bin.zip.sha256)" | sha256sum --check
      - name: Upload Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: gradle-9.4.1-bin
          path: gradle-9.4.1-bin.zip
          if-no-files-found: error
          retention-days: 1
