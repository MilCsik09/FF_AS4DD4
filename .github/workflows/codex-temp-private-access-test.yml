name: Temporary private-access scope test

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test token repository scope without transferring content
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/MilCsik09/IceSMP)"
          printf 'private_repository_http_status=%s\n' "$status"
          test "$status" = 200
